<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mathbench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700&family=Schibsted+Grotesk:wght@500&display=swap">
<style>html, body { margin: 0; height: 100%; overflow: hidden; background: #1f4fd8; -webkit-user-select: none; user-select: none; -webkit-app-region: drag; }</style>
<style>
#splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 42%, #3b6cff 0%, #1f4fd8 52%, #0e2a86 100%); transition: opacity 0.45s ease; cursor: pointer; }
#splash.out { opacity: 0; pointer-events: none; }
#splash svg { width: min(820px, 88vw); height: auto; overflow: visible; }
#splash .sp-ink { fill: #fff; fill-opacity: 0; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1100; stroke-dashoffset: 1100;
  animation: sp-draw 1.6s cubic-bezier(.45,.05,.35,1) forwards, sp-fill 0.5s ease 1.25s forwards, sp-unfill 0.45s ease 2.35s forwards, sp-undraw 1.15s cubic-bezier(.55,0,.6,1) 2.5s forwards; }
#splash .sp-word { font: 700 132px 'Bricolage Grotesque', 'Schibsted Grotesk', 'Segoe UI', system-ui, sans-serif; letter-spacing: -2px; }
#splash .sp-word .b { fill: #cfdcff; }
#splash .sp-logo { fill: none !important; stroke-width: 2.6; stroke-dasharray: 60; stroke-dashoffset: 60; animation: sp-draw-logo 0.7s ease forwards, sp-undraw-logo 0.5s ease-in 2.5s forwards; }
#splash .sp-box { fill: rgba(255, 255, 255, 0.16); stroke: rgba(255, 255, 255, 0.55); stroke-width: 1.5; opacity: 0; animation: sp-show 0.35s ease 0.05s forwards, sp-hide 0.4s ease 2.55s forwards; }
#splash .sp-clip { animation: sp-write 1.6s cubic-bezier(.45,.05,.35,1) forwards, sp-erase 1.15s cubic-bezier(.55,0,.6,1) 2.5s forwards; }
#splash .sp-pen { fill: #fff; filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px #9db7ff); opacity: 0; animation: sp-pen 1.6s cubic-bezier(.45,.05,.35,1) forwards, sp-pen-erase 1.15s cubic-bezier(.55,0,.6,1) 2.5s forwards; }
#splash .sp-tag { font: 500 22px 'Schibsted Grotesk', 'Segoe UI', system-ui, sans-serif; fill: #dce6ff; letter-spacing: 6px; opacity: 0; animation: sp-show 0.5s ease 1.45s forwards, sp-hide 0.35s ease 2.3s forwards; }
@keyframes sp-draw { to { stroke-dashoffset: 0; } }
@keyframes sp-fill { to { fill-opacity: 1; } }
@keyframes sp-unfill { to { fill-opacity: 0; } }
@keyframes sp-undraw { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1100; } }
@keyframes sp-draw-logo { to { stroke-dashoffset: 0; } }
@keyframes sp-undraw-logo { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -60; } }
@keyframes sp-write { from { width: 0; } to { width: 900px; } }
@keyframes sp-erase { from { width: 900px; transform: translateX(0); } to { width: 900px; transform: translateX(900px); } }
@keyframes sp-pen { 0% { opacity: 1; cx: 20px; } 92% { opacity: 1; } 100% { opacity: 0; cx: 880px; } }
@keyframes sp-pen-erase { 0% { opacity: 1; cx: 20px; } 92% { opacity: 1; } 100% { opacity: 0; cx: 880px; } }
@keyframes sp-show { to { opacity: 1; } }
@keyframes sp-hide { from { opacity: 1; } to { opacity: 0; } }
</style>
</head>
<body>
<div id="splash" role="presentation" title="Click to skip">
  <svg viewBox="0 0 900 260" aria-hidden="true">
    <defs><clipPath id="sp-clip"><rect class="sp-clip" x="0" y="0" width="0" height="260"/></clipPath></defs>
    <g clip-path="url(#sp-clip)">
      <rect class="sp-box" x="20" y="58" width="132" height="132" rx="34"/>
      <path class="sp-ink sp-logo" d="M18 5H7l6 7-6 7h11" transform="translate(14 52) scale(5.8)"/>
      <text class="sp-ink sp-word" x="178" y="170">Math<tspan class="b">bench</tspan></text>
    </g>
    <circle class="sp-pen" cx="20" cy="124" r="5"/>
    <text class="sp-tag" x="452" y="236" text-anchor="middle">SOLVE · GRAPH · READ</text>
  </svg>
</div>
<script>
/* the app's own startup window: a click or a key skips it (the app then shows its main window) */
const close = () => window.close();
document.getElementById('splash').addEventListener('click', close);
document.getElementById('splash').style.cssText += ';-webkit-app-region:no-drag';
addEventListener('keydown', close);
</script>
</body>
</html>
